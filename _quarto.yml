project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - blog.qmd
    # umram/index.qmd is hidden until the preprint is out
  resources:
    - profile.png
    - assets/portrait.jpg
    - resume.pdf
    - favicon.svg
    - robots.txt
    - googleaa4258336ce3cf36.html

website:
  title: "M. Tuna Alatan"
  site-url: "https://tuna-alatan.github.io"
  description: "Research in computer vision, generative modeling, and inverse problems in computational imaging."
  favicon: favicon.svg
  open-graph:
    locale: en_US
    image: profile.png
  twitter-card:
    card-style: summary
    image: profile.png
  search: false
  navbar:
    title: "M. Tuna Alatan"
    collapse: false
    right:
      - text: Notes
        href: blog.qmd
      - text: CV
        href: resume.pdf
  page-footer:
    left: "© 2026 M. Tuna Alatan"
    right:
      - text: Email
        href: mailto:tuna.alatan@gmail.com
      - text: GitHub
        href: https://github.com/tuna-alatan
      - text: LinkedIn
        href: https://www.linkedin.com/in/tuna-alatan/

format:
  html:
    theme:
      - default
      - theme.scss
    html-math-method: katex
    canonical-url: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    code-copy: true
    include-after-body: _includes/site-script.html

execute:
  freeze: auto

lang: en
